name: Auto-merge

# Fires only after CI has finished. `workflow_run` workflows are always read
# from the default branch, so this file has no effect until it is on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # Declaring a permissions block drops every scope not listed to `none`, and
  # the gate below reads check runs and commit statuses on the head SHA. Without
  # these two the API calls 403 and nothing would ever merge.
  checks: read
  statuses: read
  # `gh workflow run` below dispatches deploy.yml.
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: squash-merge a green seo/ or corroboration/ PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Gate and merge
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const slug = `${owner}/${repo}`
            const run = context.payload.workflow_run
            const headSha = run.head_sha

            // `seo/**` and `corroboration/**`: the prefix plus at least one
            // more character. A bare `seo` branch does not qualify.
            const ALLOWED = /^(seo|corroboration)\/.+/

            // Surfaced as a run annotation so the reason is readable without
            // opening the log. Every gate below returns through here.
            const skip = (why) => core.notice(`no merge: ${why}`)

            // 1. Which PR did this CI run belong to? The payload list is empty
            //    for fork PRs, so fall back to a lookup by head SHA.
            let number = (run.pull_requests || [])[0]?.number
            if (!number) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: headSha,
              })
              const open = associated.data.filter((p) => p.state === 'open')
              if (open.length !== 1) {
                return skip(`${open.length} open PRs are associated with ${headSha.slice(0, 7)} — need exactly one`)
              }
              number = open[0].number
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            const label = `#${pr.number} (${pr.head.ref})`

            // 2. Gates. Every one of these is a quiet no-op, never a failure.
            if (pr.state !== 'open') return skip(`${label} is ${pr.state}`)
            if (pr.draft) return skip(`${label} is a draft`)
            if (!ALLOWED.test(pr.head.ref)) return skip(`${label} is not under seo/ or corroboration/`)

            // A fork can name its branch anything it likes, including seo/…, so
            // never hand it a squash-merge driven by a write-scoped token.
            if (pr.head.repo?.full_name !== slug) {
              return skip(`${label} comes from a fork (${pr.head.repo?.full_name ?? 'unknown'})`)
            }

            // The branch may have moved on since CI started; those checks say
            // nothing about the current head.
            if (pr.head.sha !== headSha) {
              return skip(`${label} moved to ${pr.head.sha.slice(0, 7)} since CI ran on ${headSha.slice(0, 7)}`)
            }

            // 3. Every check on the head SHA has to have passed. `skipped` and
            //    `neutral` count as passing, the same way branch protection
            //    treats them.
            //
            //    A check that has not finished is neither a pass nor a failure,
            //    and this job only ever wakes on a CI run completing — so
            //    returning here would leave the PR with everything green, no
            //    merge, and nothing scheduled to look again. Vercel posts its
            //    deploy as a commit status and takes longer than CI does, so
            //    that is the ordinary case rather than a rare one. Wait it out:
            //    30 tries, 10s apart, then give up LOUDLY. Merge or a red job,
            //    never a stall nobody can see.
            //
            //    A genuinely failing check still exits clean: it is already red
            //    on the PR, so the author can see it without this job shouting.
            const PASSING = ['success', 'skipped', 'neutral']
            const TRIES = 30
            const nap = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

            let waitingOn = null
            let passed = 0

            for (let attempt = 1; attempt <= TRIES; attempt++) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: headSha, filter: 'latest', per_page: 100,
              })
              const others = checkRuns.filter((c) => !c.details_url?.includes(`/actions/runs/${context.runId}/`))
              const failed = others.filter((c) => c.status === 'completed' && !PASSING.includes(c.conclusion))
              if (failed.length) {
                return skip(`${label} has failing checks: ${failed.map((c) => `${c.name} (${c.conclusion})`).join(', ')}`)
              }

              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: headSha,
              })
              const statuses = combined.total_count > 0 ? combined.statuses : []
              const badStatuses = statuses.filter((st) => st.state === 'failure' || st.state === 'error')
              if (badStatuses.length) {
                return skip(`${label} has failing commit statuses: ${badStatuses.map((st) => `${st.context} (${st.state})`).join(', ')}`)
              }

              const unfinished = others.filter((c) => c.status !== 'completed')
              const stillPending = statuses.filter((st) => st.state === 'pending')
              if (!unfinished.length && !stillPending.length) {
                waitingOn = null
                passed = others.length + statuses.length
                break
              }

              waitingOn = [
                ...unfinished.map((c) => c.name),
                ...stillPending.map((st) => `${st.context} (commit status)`),
              ]
              core.info(`  attempt ${attempt}/${TRIES}: waiting on ${waitingOn.join(', ')}`)
              if (attempt < TRIES) await nap(10000)
            }

            if (waitingOn) {
              core.setFailed(`${label} not merged: checks never settled within 5 minutes — still waiting on ${waitingOn.join(', ')}`)
              return
            }

            core.info(`${label}: ${passed} checks passed on ${headSha.slice(0, 7)} — squash-merging`)

            // 4. Merge, pinned to the SHA we vetted so a push landing in this
            //    window loses the race instead of riding in unchecked.
            try {
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'squash', sha: headSha,
              })
            } catch (error) {
              if (error.status === 405 || error.status === 409) {
                return skip(`${label} could not be merged (${error.status}): ${error.message}`)
              }
              throw error
            }

            core.notice(`Squash-merged ${label}`)

            // Set before the branch delete, and read by a step that runs even
            // if this one later fails: once the merge has landed the deploy
            // has to follow it, whatever happens to the cleanup below.
            core.setOutput('merged', 'true')
            core.setOutput('pr', String(pr.number))
            core.setOutput('sha', headSha)

            // 5. Delete the head branch. Already gone (repo-level auto-delete
            //    got there first) is not an error.
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` })
              core.info(`Deleted ${pr.head.ref}`)
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error
              core.info(`${pr.head.ref} was already deleted`)
            }

      # A squash-merge made with GITHUB_TOKEN raises a push event that deploy.yml
      # will never see — GitHub suppresses workflow triggering for events its own
      # token caused, to stop workflows looping. The IndexNow ping lives in that
      # workflow, so without this step an auto-merged seo/ PR would go live and
      # never tell Bing. workflow_dispatch is an explicit exception to the
      # suppression rule, so dispatching it does start a real run.
      #
      # `always()` because the merge is the irreversible half: if the branch
      # delete above threw, the commit is still on main and still needs a deploy.
      # A dispatch that does not produce a run fails the job — the eleven days of
      # unfired pings were a skip that exited 0.
      - name: Deploy the merged commit
        if: always() && steps.gate.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MERGED_PR: ${{ steps.gate.outputs.pr }}
          MERGED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          since="$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy.yml --ref main

          # `gh workflow run` reports nothing about the run it created, so find
          # it: the newest workflow_dispatch run on main raised since we started.
          for i in $(seq 1 18); do
            runs="$(gh run list --workflow=deploy.yml --event=workflow_dispatch \
                      --branch=main --limit 20 --json url,createdAt)"
            url="$(printf '%s' "$runs" \
                     | jq -r --arg since "$since" \
                         '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .url // empty')"
            if [ -n "$url" ]; then
              echo "::notice::PR #$MERGED_PR merged as $MERGED_SHA — deploy run: $url"
              echo "Deploy for #$MERGED_PR ($MERGED_SHA): $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i/18: no run raised yet"
            sleep 5
          done
          echo "::error::deploy.yml was dispatched for $MERGED_SHA but no run appeared within 90s"
          exit 1

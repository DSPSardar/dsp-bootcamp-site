name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Check Vercel secrets
        id: vercel-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment skipped because one or more required repository secrets are missing."
          fi
      - name: Deploy to Vercel
        if: steps.vercel-secrets.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      # Vercel deploys this repo through its own GitHub integration, so the
      # steps above are skipped whenever the VERCEL_* secrets are absent —
      # and until 2026-09-12 the IndexNow ping was skipped along with them,
      # silently, since the day it shipped. It must not depend on them.
      #
      # scripts/indexnow-ping.mjs reads the LIVE sitemap to work out which
      # URLs changed, so pinging the instant the push lands would read the
      # previous build. Wait for the new one, then ping. Never fail the
      # deploy over this: a timeout still pings, and the script exits 0 on
      # any network error.
      - name: Wait for the production deploy to go live
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          for i in $(seq 1 12); do
            if curl -sf --max-time 20 https://www.digitalservicesprogram.com/sitemap.xml \
                 | grep -q "<lastmod>$TODAY"; then
              echo "live build is serving $TODAY (after $((i * 20))s)"
              exit 0
            fi
            sleep 20
          done
          echo "timed out waiting for $TODAY in the sitemap — pinging anyway"
      - name: Notify IndexNow of changed URLs
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow-ping.mjs

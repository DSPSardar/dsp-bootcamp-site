name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Check Vercel secrets
        id: vercel-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment skipped because one or more required repository secrets are missing."
          fi
      - name: Deploy to Vercel
        if: steps.vercel-secrets.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      # Vercel deploys this repo through its own GitHub integration, so the
      # steps above are skipped whenever the VERCEL_* secrets are absent —
      # and until 2026-09-12 the IndexNow ping was skipped along with them,
      # silently, since the day it shipped. It must not depend on them.
      #
      # scripts/indexnow-ping.mjs reads the LIVE sitemap to work out which
      # URLs changed, so pinging before the new build is live just tells Bing
      # to recrawl the old HTML. Wait for the new one, then ping.
      #
      # The wait used to poll that sitemap for today's <lastmod>, which was
      # wrong in the one direction nobody notices: with a merge landing most
      # days, the sitemap ALREADY carried today's date from an earlier deploy,
      # so the poll matched on the first attempt and the ping went out against
      # the previous build. A date cannot tell two deploys on the same day
      # apart. /api/build-info stamps the commit each build shipped with, so
      # this waits for THIS commit and nothing else.
      #
      # Budget is 8 minutes (48 x 10s). A timeout now fails the job instead of
      # pinging anyway: a wrong ping is worse than a loud one, and a silent
      # skip here is what hid the unfired pings for eleven days.
      - name: Wait for the production deploy to serve this commit
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_INFO_URL: https://www.digitalservicesprogram.com/api/build-info
        run: |
          set -uo pipefail
          echo "waiting for $BUILD_INFO_URL to serve $EXPECTED_SHA"
          for i in $(seq 1 48); do
            served="$(curl -sf --max-time 15 -H 'cache-control: no-cache' \
                        "$BUILD_INFO_URL?t=$(date +%s)" 2>/dev/null \
                        | jq -r '.sha // empty' 2>/dev/null || true)"
            if [ "$served" = "$EXPECTED_SHA" ]; then
              echo "live build is serving $EXPECTED_SHA (after $((i * 10))s)"
              exit 0
            fi
            echo "  attempt $i/48: serving ${served:-<no response>}"
            sleep 10
          done
          echo "::error::production never served $EXPECTED_SHA within 8 minutes — IndexNow not pinged"
          exit 1
      - name: Notify IndexNow of changed URLs
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow-ping.mjs
